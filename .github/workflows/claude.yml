# Mention @claude in a PR or issue comment to ask Claude to explain, fix or change something.
# Only the repo owner, org members and collaborators can trigger it (this repo is public).
# Needs ONE repo secret: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN. Without one the job skips itself.
name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Skip if no Claude key is set
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ok=$HAS_KEY" >> "$GITHUB_OUTPUT"
          [ "$HAS_KEY" = "true" ] || echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret; skipping."
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}   # comments as github-actions; no Claude GitHub App install needed
          claude_args: |
            --append-system-prompt "Read AGENTS.md first and follow it. Never push to main; work on the PR branch or open a new branch and PR. Run node scripts/check.mjs before committing."
            --allowedTools "Bash(node scripts/check.mjs),Bash(node --no-warnings scripts/check.mjs),Bash(git:*),Bash(gh pr:*),Read,Edit,Write,Grep,Glob"
